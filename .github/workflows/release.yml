name: Release PWA and Edge package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-version.mjs
      - run: npm run verify
      - name: Package Edge extension
        run: |
          cd dist/edge-extension
          zip -r ../blackboard-text-edge-${{ github.ref_name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: blackboard-text-edge-${{ github.ref_name }}
          path: dist/blackboard-text-edge-${{ github.ref_name }}.zip
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa

  deploy-pwa:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
