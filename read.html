<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Published note — Blackboard Text</title>
  <meta name="description" content="A shared copy from Blackboard Text.">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0B0B0D">
  <link rel="icon" href="icons/icon-48.png" sizes="48x48">
  <link rel="stylesheet" href="editor.css">
</head>
<body class="reader-body">
  <nav id="readerViewControls" class="reader-view-controls" aria-label="Reading view" hidden>
    <button id="readerBoardMode" type="button" aria-pressed="true">Original board</button>
    <button id="readerTextMode" type="button" aria-pressed="false">Readable text</button>
    <label id="readerZoomLabel">Zoom <select id="readerZoom"><option value="fit">Fit</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
    <span id="readerModeHint">Original layout, including drawings.</span>
  </nav>
  <div class="reader-viewport">
  <div id="readerBoard" class="reader-board">
    <div id="readerShell" class="reader-shell">
      <header class="reader-header" id="readerHeader" hidden>
        <span class="reader-emoji" id="readerEmoji" aria-hidden="true"></span>
        <h1 class="reader-title" id="readerTitle"></h1>
        <p class="reader-meta" id="readerMeta"></p>
      </header>

      <article class="reader-content" id="readerContent"></article>
    </div>

    <canvas id="readerDrawings" class="reader-drawings" aria-hidden="true"></canvas>
  </div>

  </div>

  <div class="reader-state" id="readerState" hidden>
    <div class="reader-state-surface">
      <p class="reader-state-eyebrow">Blackboard Text</p>
      <h1 id="readerStateTitle">Opening note…</h1>
      <p id="readerStateText">This page reads notes that were published as a link.</p>
      <a class="reader-state-action" href="editor.html">Open Blackboard Text</a>
    </div>
  </div>

  <details id="readerDrawingDescription" class="reader-drawing-description" hidden><summary>Drawing description</summary><p id="readerDrawingDescriptionText"></p></details>
  <footer class="reader-footer" id="readerFooter" hidden>
    <a href="editor.html">Written in Blackboard Text</a>
  </footer>

  <script type="module" src="src/ui/reader.js"></script>
</body>
</html>
